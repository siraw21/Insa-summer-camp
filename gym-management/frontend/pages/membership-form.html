<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Assign Membership | FitTrack</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html" class="brand">
            <span class="brand-mark"> F </span>

            <span class="brand-text"> FitTrack </span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-section-title">Management</p>

          <ul class="nav-list">
            <li>
              <a href="dashboard.html" class="nav-link">
                <span class="nav-icon"> ▦ </span>

                <span class="nav-label"> Dashboard </span>
              </a>
            </li>

            <li>
              <a href="members.html" class="nav-link">
                <span class="nav-icon"> ◉ </span>

                <span class="nav-label"> Members </span>
              </a>
            </li>

            <li>
              <a href="memberships.html" class="nav-link active">
                <span class="nav-icon"> ◆ </span>

                <span class="nav-label"> Memberships </span>
              </a>
            </li>

            <li>
              <a href="plans.html" class="nav-link">
                <span class="nav-icon"> ▤ </span>

                <span class="nav-label"> Plans </span>
              </a>
            </li>

            <li>
              <a href="payments.html" class="nav-link">
                <span class="nav-icon"> $ </span>

                <span class="nav-label"> Payments </span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <button id="logout-btn" class="btn btn-secondary" style="width: 100%">
            Logout
          </button>
        </div>
      </aside>

      <!-- MAIN -->

      <main class="main">
        <header class="topbar">
          <div class="page-title">Membership</div>

          <div class="user-menu">
            <div class="user-avatar">A</div>

            <div class="user-info">
              <span class="user-name"> Admin </span>

              <span class="user-role"> Gym Owner </span>
            </div>
          </div>
        </header>

        <section class="page-content">
          <div class="page-header">
            <div>
              <h1 id="page-title">Assign Membership</h1>

              <p id="page-description">
                Assign a membership plan to a gym member.
              </p>
            </div>

            <a href="memberships.html" class="btn btn-secondary"> ← Back </a>
          </div>

          <div
            id="error-message"
            class="alert alert-error"
            style="display: none"
          ></div>

          <div
            id="success-message"
            class="alert alert-success"
            style="display: none"
          ></div>

          <div class="card">
            <div class="card-header">
              <h2>Membership Information</h2>
            </div>

            <div class="card-body">
              <form id="membership-form">
                <!-- MEMBER -->

                <div class="form-group">
                  <label for="member"> Member </label>

                  <select id="member" name="member" required>
                    <option value="">Select member</option>
                  </select>
                </div>

                <!-- PLAN -->

                <div class="form-group">
                  <label for="plan"> Membership Plan </label>

                  <select id="plan" name="plan" required>
                    <option value="">Select membership plan</option>
                  </select>
                </div>

                <!-- START DATE -->

                <div class="form-group">
                  <label for="start-date"> Start Date </label>

                  <input
                    id="start-date"
                    name="start_date"
                    type="date"
                    required
                  />
                </div>

                <!-- PLAN PREVIEW -->

                <div
                  id="plan-preview"
                  class="card"
                  style="
                    display: none;
                    margin-top: 20px;
                    background: var(--background);
                  "
                >
                  <div class="card-body">
                    <h3 id="preview-plan-name">—</h3>

                    <p id="preview-description" style="margin-top: 6px">—</p>

                    <div
                      style="
                        display: flex;
                        gap: 30px;
                        margin-top: 15px;
                        flex-wrap: wrap;
                      "
                    >
                      <div>
                        <span class="stat-label"> Price </span>

                        <strong id="preview-price"> — </strong>
                      </div>

                      <div>
                        <span class="stat-label"> Duration </span>

                        <strong id="preview-duration"> — </strong>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- ACTIONS -->

                <div class="action-group" style="margin-top: 25px">
                  <a href="memberships.html" class="btn btn-secondary">
                    Cancel
                  </a>

                  <button type="submit" id="submit-btn" class="btn btn-primary">
                    Assign Membership
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/membership-form.js"></script>
  </body>
</html>
