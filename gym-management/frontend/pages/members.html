<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Members | FitTrack</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html" class="brand">
            <span class="brand-mark">F</span>
            <span class="brand-text">FitTrack</span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-section-title">Management</p>

          <ul class="nav-list">
            <li>
              <a href="dashboard.html" class="nav-link">
                <span class="nav-icon">▦</span>
                <span class="nav-label">Dashboard</span>
              </a>
            </li>

            <li>
              <a href="members.html" class="nav-link active">
                <span class="nav-icon">◉</span>
                <span class="nav-label">Members</span>
              </a>
            </li>

            <li>
              <a href="memberships.html" class="nav-link">
                <span class="nav-icon">◆</span>
                <span class="nav-label">Memberships</span>
              </a>
            </li>

            <li>
              <a href="plans.html" class="nav-link">
                <span class="nav-icon">▤</span>
                <span class="nav-label">Plans</span>
              </a>
            </li>

            <li>
              <a href="payments.html" class="nav-link">
                <span class="nav-icon">$</span>
                <span class="nav-label">Payments</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <button id="logout-btn" class="btn btn-secondary" style="width: 100%">
            Logout
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="page-title">Members</div>

          <div class="user-menu">
            <div class="user-avatar">A</div>

            <div class="user-info">
              <span class="user-name"> Admin </span>

              <span class="user-role"> Gym Owner </span>
            </div>
          </div>
        </header>

        <section class="page-content">
          <div class="page-header">
            <div>
              <h1>Members</h1>

              <p>Manage your gym members and their information.</p>
            </div>

            <a href="member-form.html" class="btn btn-primary">
              + Add Member
            </a>
          </div>

          <div
            id="error-message"
            class="alert alert-error"
            style="display: none"
          ></div>

          <div class="card">
            <div class="card-header">
              <h2>All Members</h2>

              <span id="member-count" class="stat-label"> — </span>
            </div>

            <div class="card-body">
              <div class="toolbar">
                <div class="search-box">
                  <input
                    id="search-input"
                    type="search"
                    placeholder="Search members..."
                  />
                </div>
              </div>

              <div id="loading" class="loading">Loading members...</div>

              <div id="empty-state" class="empty-state" style="display: none">
                No members found.
              </div>

              <div class="table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Member</th>
                      <th>Phone</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>

                  <tbody id="members-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/members.js"></script>
  </body>
</html>
