<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <title>Cart | Merkato Ecommerce</title>
  </head>

  <body>
    <header>
      <div class="container header-container">
        <div class="brand">
          <img
            class="logo"
            src="images/logo.jpg"
            alt="Merkato Ecommerce Logo"
          />

          <span class="brand-name"> Merkato Ecommerce </span>
        </div>

        <nav>
          <ul>
            <li>
              <a href="index.html"> Home </a>
            </li>

            <li>
              <a href="products.html"> Products </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="cart-section">
          <h1 class="page-title">Shopping Cart</h1>

          <div class="table-wrapper">
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Product</th>

                  <th>Quantity</th>

                  <th>Price</th>

                  <th>Option</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>
                    <div class="cart-product">
                      <img src="images/hp.jpg" alt="HP Laptop" />

                      <span> HP Laptop </span>
                    </div>
                  </td>

                  <td>1</td>

                  <td>85,000 ETB</td>

                  <td>
                    <a href="order.html" class="btn"> Order </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="order-summary">
          <h2>Summary</h2>

          <div class="summary-item">
            <span> Subtotal </span>

            <span> 85,000 ETB </span>
          </div>

          <div class="summary-item">
            <span> Shipping </span>

            <span> Free </span>
          </div>

          <div class="summary-total">
            <span> Total </span>

            <span> 85,000 ETB </span>
          </div>

          <a href="order.html" class="btn btn-block"> Checkout </a>
        </section>
      </div>
    </main>

    <footer>
      <div class="container">
        Merkato Ecommerce

        <span> 2018 E.C </span>
      </div>
    </footer>
  </body>
</html>
