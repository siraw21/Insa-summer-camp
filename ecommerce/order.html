<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <title>Order | Merkato Ecommerce</title>
  </head>

  <body>
    <header>
      <div class="container header-container">
        <div class="brand">
          <img
            class="logo"
            src="images/logo.jpg"
            alt="Merkato Ecommerce Logo"
          />

          <span class="brand-name"> Merkato Ecommerce </span>
        </div>

        <nav>
          <ul>
            <li>
              <a href="index.html"> Home </a>
            </li>

            <li>
              <a href="cart.html"> Cart </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="order-section">
          <div class="order-form">
            <h1 class="page-title">Order Details</h1>

            <form action="">
              <div class="form-group">
                <label for="payment-method"> Payment Method </label>

                <select id="payment-method">
                  <option>Credit Card</option>

                  <option>Mobile Money</option>
                </select>
              </div>

              <div class="form-group">
                <label for="payment-option"> Payment Option </label>

                <select id="payment-option">
                  <option>TeleBirr</option>

                  <option>CBEBirr</option>
                </select>
              </div>

              <div class="form-group">
                <label for="postcode"> Post Code </label>

                <input
                  type="number"
                  id="postcode"
                  placeholder="Enter post code"
                />
              </div>

              <div class="form-group">
                <label for="address"> Address </label>

                <input
                  type="text"
                  id="address"
                  placeholder="Enter delivery address"
                />
              </div>

              <button class="btn btn-block">Send Order</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container">
        Merkato Ecommerce

        <span> 2018 E.C </span>
      </div>
    </footer>
  </body>
</html>
