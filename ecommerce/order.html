<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Login</title>
  </head>
  <body>
    <header>
      <div class="container header-container">
        <div class="brand">
          <img class="logo" src="images/logo.jpg" alt="logo" />
          <span class="brand-name">Merkato Ecommerce</span>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <h1>Order Detail</h1>
        <form action="">
          <label for="payment-method">Payment-Method</label>
          <select name="" id="payment-method">
            <option value="">Credit</option>
            <option value="">Mobile Money</option>
          </select>
          <br /><br />
          <label for="payment-option">Payment Option:</label>
          <select name="" id="payment-option">
            <option value="">TeleBirr</option>
            <option value="">CBEBirr</option></select
          ><br /><br />
          <label for="post">Post Code:</label>
          <input type="number" /><br /><br />
          <label for="address"> Address </label>
          <input type="text" /><br /><br />
          <button>send</button>
        </form>
      </div>
    </main>
    <br /><br />
    <footer>
      <div class="container">
        Merkato Ecommerce <span id="foot-year">2018E.C</span>
      </div>
    </footer>
  </body>
</html>
