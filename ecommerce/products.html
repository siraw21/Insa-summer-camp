<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/products.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <title>Products | Merkato Ecommerce</title>
  </head>

  <body>
    <div id="toast" class="toast"></div>
    <header>
      <div class="container header-container">
        <div class="brand">
          <img
            class="logo"
            src="images/logo.jpg"
            alt="Merkato Ecommerce Logo"
          />

          <span class="brand-name"> Merkato Ecommerce </span>
        </div>

        <div class="search-bar">
          <input type="search" placeholder="Search products..." />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <nav>
          <ul>
            <li>
              <a href="index.html"> Home </a>
            </li>

            <li>
              <a href="products.html"> Products </a>
            </li>

            <li id="login-nav">
              <a href="login.html">Login</a>
            </li>

            <li id="register-nav">
              <a href="register.html">Register</a>
            </li>

            <li id="logout-nav">
              <a href="#" id="logout-link">Logout</a>
            </li>
            <li>
              <a href="cart.html">
                <i class="fa-solid fa-cart-shopping"></i>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1 class="products-page-title">Products</h1>

        <section class="products-filter">
          <div class="filters">
            <button class="active">All Categories</button>
            <button>Phones</button>
            <button>Computers</button>
            <button>Tablets</button>
            <button>Accessories</button>
          </div>
        </section>

        <section class="products-section">
          <div class="products">
            <article
              class="card product-card"
              data-id="1"
              data-name="Desktop"
              data-price="100000"
              data-image="images/desk1.jpg"
            >
              <img src="images/desk1.jpg" alt="Desktop" />
              <div class="card-content">
                <h3>Desktop</h3>
                <span class="price">100,000 ETB</span>
                <button class="btn add-to-cart">Add To Cart</button>
                <!-- <button class="btn">Detail</button> -->
              </div>
            </article>

            <article
              class="card product-card"
              data-id="2"
              data-name="HP Laptop"
              data-price="85000"
              data-image="images/hp.jpg"
            >
              <img src="images/hp.jpg" alt="HP Laptop" />
              <div class="card-content">
                <h3>HP Laptop</h3>
                <span class="price">85,000 ETB</span>
                <button class="btn add-to-cart">Add To Cart</button>
                <!-- <button class="btn">Detail</button> -->
              </div>
            </article>

            <article
              class="card product-card"
              data-id="3"
              data-name="USB Flash Drive"
              data-price="1500"
              data-image="images/usb.jpg"
            >
              <img src="images/usb.jpg" alt="USB Flash Drive" />
              <div class="card-content">
                <h3>USB Flash Drive</h3>
                <span class="price">1,500 ETB</span>
                <button class="btn add-to-cart">Add To Cart</button>
                <!-- <button class="btn">Detail</button> -->
              </div>
            </article>

            <article
              class="card product-card"
              data-id="4"
              data-name="Mobile Charger"
              data-price="1500"
              data-image="images/mob-char.jpg"
            >
              <img src="images/mob-char.jpg" alt="Mobile Charger" />

              <div class="card-content">
                <h3>Mobile Charger</h3>
                <span class="price">1,500 ETB</span>
                <button class="btn add-to-cart">Add To Cart</button>
                <!-- <button class="btn">Detail</button> -->
              </div>
            </article>

            <article
              class="card product-card"
              data-id="5"
              data-name="iPhone"
              data-price="95000"
              data-image="images/iphone.jpg"
            >
              <img src="images/iphone.jpg" alt="iPhone" />
              <div class="card-content">
                <h3>iPhone</h3>
                <span class="price">95,000 ETB</span>
                <button class="btn add-to-cart">Add To Cart</button>
                <!-- <button class="btn">Detail</button> -->
              </div>
            </article>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container">
        Merkato Ecommerce

        <span> 2018 E.C </span>
      </div>
    </footer>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
