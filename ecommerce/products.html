<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style></style>
    <title>Product</title>
  </head>
  <body>
    <header>
      <div class="container header-container">
        <div class="brand">
          <img class="logo" src="images/logo.jpg" alt="logo" />
          <span class="brand-name">Merkato Ecommerce</span>
        </div>
        <div class="search-bar">
          <input type="search" placeholder="Search.." />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="filters">
          <button class="active">All Categories</button>
          <button>Phones</button>
          <button>Computes</button>
          <button>Tablets</button>
        </section>
        <h2>Products</h2>

        <section class="products">
          <article class="card">
            <img src="images/desk1.jpg" alt="" />
            <div class="card-content">
              <h3>Desktop</h3>
              <span class="price">100,000ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>

          <article class="card">
            <img src="images/hp.jpg" alt="" />
            <div class="card-content">
              <h3>Hp</h3>
              <span class="price">85,000ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
          <article class="card">
            <img src="/images/usb.jpg" alt="usb" />
            <div class="card-content">
              <h3>USB</h3>
              <span class="price">1500ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
          <article class="card">
            <img src="/images/usb1.jpg" alt="" />
            <div class="card-content">
              <h3>USB</h3>
              <span class="price">1500ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
          <article class="card">
            <img src="/images/mob-char.jpg" alt="" />
            <div class="card-content">
              <h3>Mobile Charger</h3>
              <span class="price">1500ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
          <article class="card">
            <div class="card-content">
              <h3>Iphone</h3>
              <img src="/images/iphone.jpg" alt="" />
              <span class="price">1500ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
          <article class="card">
            <img src="/images/iphone2.jpg" alt="" />
            <div class="card-content">
              <h3>Iphone</h3>

              <span class="price">1500ETB</span>
              <button>Add To Cart</button>
              <button>Detail</button>
            </div>
          </article>
        </section>
      </div>
    </main>
    <br /><br />
    <footer>
      <div class="container">
        Merkato Ecommerce <span id="foot-year">2018E.C</span>
      </div>
    </footer>
  </body>
</html>
